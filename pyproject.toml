[project]
name = "chargeops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bhuwan Joshi", email = "bhuwanjoshi.it@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.2.0",
    "openai>=3.19.2",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlglot>=30.19.0",
]

[project.scripts]
chargeops = "chargeops:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: needs a running database (docker compose up -d)",
]
